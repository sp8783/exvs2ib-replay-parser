name: CI

# 依存が入り、コードが読み込めて --help が出ることを確かめる（Dependabot の PR を自動でマージする門）
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: システム依存パッケージをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 読み込めることを確かめる
        run: |
          python -m compileall -q main.py src tools
          python main.py --help
